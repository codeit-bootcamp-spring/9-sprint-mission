events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend_servers {
        # --- Load Balancing Strategies ---
        # 1. Round Robin: (Default, no directive needed)
        # 2. Least Connections: least_conn;
        # 3. IP Hash: ip_hash;
        # 4. Weight: server backend:8080 weight=3;
        
        # least_conn;
        # ip_hash;
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # SSE (Server-Sent Events) Location
        location ^~ /api/sse {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE specific headers
            proxy_set_header Cache-Control no-cache;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            chunked_transfer_encoding on;

            add_header X-Upstream-Server $upstream_addr;
        }

        # General API Location
        location ^~ /api/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Upstream-Server $upstream_addr;
        }

        # WebSocket Location with trailing slash
        location ^~ /ws/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Upstream-Server $upstream_addr;
        }

        # WebSocket Location without trailing slash (fallback for Spring STOMP handshake endpoint)
        location ^~ /ws {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Upstream-Server $upstream_addr;
        }

        # 2. 그 외 모든 요청은 프론트엔드 정적 리소스 서빙
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # SPA 라우팅 대응
        }
    }
}