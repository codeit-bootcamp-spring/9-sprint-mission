version: "3.8"

services:

  nginx:
    image: nginx:alpine

    ports:
      - "3000:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html

    depends_on:
      - backend

    networks:
      - discodeit-network


  backend:
    image: discodeit:local

    build:
      context: .
      dockerfile: Dockerfile

    deploy:
      replicas: 3

    environment:

      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/discodeit
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: broker:29092

      STORAGE_TYPE: s3

      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

    depends_on:
      - db
      - redis
      - broker

    networks:
      - discodeit-network


  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - discodeit-network


  redis:
    image: redis:7.2-alpine

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - discodeit-network


  broker:
    image: apache/kafka:latest

    hostname: broker

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    networks:
      - discodeit-network


volumes:
  postgres-data:
  redis-data:

networks:
  discodeit-network: