services:
  db:
    image: postgres:15
    container_name: discodeit-db
    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # 데이터 유지 (요구사항)
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql # 자동 실행 (요구사항)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d discodeit"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: . # 로컬 Dockerfile에서 빌드 (요구사항)
    container_name: discodeit-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB 연결 정보 (prod 프로필 기준)
      DB_URL: jdbc:postgresql://db:5432/discodeit
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod

      # BinaryContentStorage 설정
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_LOCAL_ROOT_PATH: /app/uploads

      # AWS 설정 (S3 미션 관련)
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}

      JVM_OPTS: ${JVM_OPTS:-}
    ports:
      - "8081:80" # 요구사항: 로컬 8081 -> 컨테이너 80
    volumes:
      - ./uploads:/app/uploads # BinaryContentStorage 데이터 유지 (요구사항)

volumes:
  pgdata: # DB 데이터를 영구 저장할 볼륨 정의