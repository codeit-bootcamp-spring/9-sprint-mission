version: '3.8'

services:
  # 1. PostgreSQL 서비스
  db:
    image: postgres:15-alpine
    container_name: discodeit-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      # 컨테이너가 재시작되어도 DB 데이터가 날아가지 않도록 볼륨 유지
      - db-data:/var/lib/postgresql/data
      # PostgreSQL 서비스가 처음 실행될 때 schema.sql 자동 실행
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  # 2. Spring Boot 애플리케이션 서비스
  app:
    build:
      context: .               # 현재 폴더의 로컬 Dockerfile을 사용해 빌드
      dockerfile: Dockerfile
    container_name: discodeit-app-compose
    env_file:
      - .env                   # .env 파일의 환경 변수를 앱에 전달
    ports:
      - "8080:80"              # localhost:8080으로 접속 시 컨테이너의 80 포트로 연결
    volumes:
      # BinaryContentStorage 데이터 유지를 위한 볼륨 매핑
      # (로컬 스토리지가 /app/storage에 저장된다고 가정합니다. 만약 다른 경로라면 수정 가능합니다)
      - app-storage:/app/storage
    depends_on:
      - db                     # db 서비스가 먼저 실행된 후 app 서비스가 실행되도록 의존성 설정
    restart: always

# 도커가 관리할 가상의 하드디스크(볼륨) 선언
volumes:
  db-data:
  app-storage: