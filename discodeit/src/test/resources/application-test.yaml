spring:
  config:
    activate:
      on-profile: test

  boot:
    admin:
      client:
        enabled: false

  datasource:
    url: jdbc:h2:mem:discodeit-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  sql:
    init:
      mode: never

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

  cache:
    type: simple

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.orm.jpa: DEBUG
    org.springframework.test.context: INFO

discodeit:
  admin:
    enabled: false
    username: admin
    email: admin@discodeit.local
    password:
  security:
    token:
      secret: test-token-secret-key-for-test-context
  storage:
    type: local
    local:
      root-path: ./storage/test
