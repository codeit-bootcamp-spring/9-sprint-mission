spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

discodeit:
  storage:
    type: local
    local:
      root-path: ./build/test-storage
    s3:
      access-key: dummy
      secret-key: dummy
      region: ap-northeast-2
      bucket: dummy
      presigned-url-expiration: 600