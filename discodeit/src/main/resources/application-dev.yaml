spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_HOST_PORT:5433}}/${POSTGRES_DB:discodeit}
    username: ${DB_USER:discodeit_user}
    password: ${DB_PASSWORD:discodeit1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  kafka:
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

server:
  port: 8080

discodeit:
  admin:
    enabled: true
    password: ${DISCODEIT_ADMIN_PASSWORD:dev-admin-password-change-me}

logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
