spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_HOST_PORT:5433}}/${POSTGRES_DB:discodeit}
    username: ${DB_USER:discodeit_user}
    password: ${DB_PASSWORD:discodeit1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

discodeit:
  notification:
    kafka:
      enabled: ${KAFKA_NOTIFICATION_ENABLED:false}
    spring-event-listener:
      enabled: ${SPRING_EVENT_NOTIFICATION_ENABLED:true}
  admin:
    enabled: true
    username: ${DISCODEIT_ADMIN_USERNAME:admin}
    email: ${DISCODEIT_ADMIN_EMAIL:admin@discodeit.local}
    password: ${DISCODEIT_ADMIN_PASSWORD:dev-admin-password-change-me}
  security:
    token:
      secret: ${DISCODEIT_TOKEN_SECRET:discodeit-token-secret-key-for-local-development-change-me}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
      upload-delay-millis: ${STORAGE_LOCAL_UPLOAD_DELAY_MILLIS:3000}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: INFO
