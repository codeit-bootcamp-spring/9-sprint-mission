spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

server:
  port: 8080

discodeit:
  admin:
    enabled: true
    password: ${DISCODEIT_ADMIN_PASSWORD:dev-admin-password-change-me}
  security:
    remember-me:
      key: ${DISCODEIT_REMEMBER_ME_KEY:dev-remember-me-key-change-me}

logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
