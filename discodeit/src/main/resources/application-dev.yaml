server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:discodeit
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  application:
    name: discodeit
  boot:
    admin:
      client:
        url: http://localhost:9090

logging:
  level:
    root: DEBUG
    com.zaxxer.hikari: INFO
    javax.management: INFO
    sun.rmi: INFO

info:
  major-config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: "LOCAL"
      path: "${user.dir}/storage"
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - loggers
          - caches
  observations:
    annotations:
      enabled: true
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true