server:
  port: 8080

spring:
  boot:
    admin:
      client:
        url: http://localhost:9090
        instance:
          name: discodeit
  datasource:
    url: jdbc:h2:mem:discodeit_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

info:
  config:
    datasource:
      url: jdbc:h2:mem:discodeit_db
      driver-class-name: org.h2.Driver
    jpa:
      ddl-auto: update
    storage:
      type: local
      path: ./.storage
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.sprint.mission.discodeit: debug