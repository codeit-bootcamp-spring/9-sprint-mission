spring:
  profiles:
    active: dev
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Actuator 엔드포인트
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"
  endpoint:
    info:
      enabled: true

# [요구사항] 애플리케이션 상세 정보
info:
  app:
    name: "Discodeit"
    version: "1.7.0"
    java-version: "17"
    spring-boot-version: "3.4.0"
  configuration:
    datasource:
      # 실제 datasource 설정이 있는 경로를 참조하세요.
      # 보통 spring.datasource.url 등에 정의됩니다.
      url: "${spring.datasource.url:jdbc:postgresql://localhost:5432/discodeit}"
      driver-class-name: "${spring.datasource.driver-class-name:org.postgresql.Driver}"
    jpa:
      ddl-auto: "${spring.jpa.hibernate.ddl-auto}"
    storage:
      # 아래 discodeit 설정값을 그대로 참조합니다.
      type: "${discodeit.storage.type}"
      path: "${discodeit.storage.local.root-path}"
    multipart:
      max-file-size: "${spring.servlet.multipart.max-file-size}"
      max-request-size: "${spring.servlet.multipart.max-request-size}"

discodeit:
  repository:
    type: jpa
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: ./data/storage