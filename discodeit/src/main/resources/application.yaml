spring:
  application:
    name: discodeit
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, loggers"
  info:
    env:
      enabled: true

info:
  app:
    name: "Discodeit"
    version: "1.7.0"
    java-version: "17"
    spring-boot-version: "3.4.0"
  config:
    datasource:
      url: "${spring.datasource.url}"
      driver-class-name: "${spring.datasource.driver-class-name}"
    jpa:
      ddl-auto: "${spring.jpa.hibernate.ddl-auto}"
    storage:
      type: "local"
      path: ".discodeit/storage"
    multipart:
      max-file-size: "10MB"
      max-request-size: "30MB"