spring:
  application:
    name: discodeit
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

discodeit:
  admin:
    enabled: ${DISCODEIT_ADMIN_ENABLED:false}
    username: ${DISCODEIT_ADMIN_USERNAME:admin}
    email: ${DISCODEIT_ADMIN_EMAIL:admin@discodeit.local}
    password: ${DISCODEIT_ADMIN_PASSWORD}
  security:
    token:
      secret: ${DISCODEIT_TOKEN_SECRET:discodeit-token-secret-key-for-local-development-change-me}
      expiration-seconds: ${DISCODEIT_TOKEN_EXPIRATION_SECONDS:86400}
      refresh-expiration-seconds: ${DISCODEIT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}

info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: 17
    spring-boot-version: 3.5.10
  datasource:
    url: ${spring.datasource.url:N/A}
    driver-class-name: ${spring.datasource.driver-class-name:N/A}
  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto:N/A}
  storage:
    type: ${discodeit.storage.type:N/A}
    path: ${discodeit.storage.local.root-path:N/A}
    s3-bucket: ${AWS_S3_BUCKET:N/A}
    s3-region: ${AWS_S3_REGION:N/A}
  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size:N/A}
    max-request-size: ${spring.servlet.multipart.max-request-size:N/A}
