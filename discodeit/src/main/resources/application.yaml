spring:
  application:
    name: discodeit

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  cache:
    cache-names:
      - channelsByUser
      - notificationsByReceiver
      - users
    redis:
      enable-statistics: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,caches
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  observations:
    annotations:
      enabled: true

discodeit:
  admin:
    enabled: ${DISCODEIT_ADMIN_ENABLED:false}
    username: ${DISCODEIT_ADMIN_USERNAME}
    email: ${DISCODEIT_ADMIN_EMAIL}
    password: ${DISCODEIT_ADMIN_PASSWORD:}
  security:
    token:
      secret: ${DISCODEIT_TOKEN_SECRET}
      expiration-seconds: ${DISCODEIT_TOKEN_EXPIRATION_SECONDS:86400}
      refresh-expiration-seconds: ${DISCODEIT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
  storage:
    type: ${STORAGE_TYPE}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
      retry:
        max-attempts: ${AWS_S3_RETRY_MAX_ATTEMPTS:3}
        delay: ${AWS_S3_RETRY_DELAY:1000}
        multiplier: ${AWS_S3_RETRY_MULTIPLIER:2.0}

info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: 17
    spring-boot-version: 3.5.10
  datasource:
    url: ${spring.datasource.url:N/A}
    driver-class-name: ${spring.datasource.driver-class-name:N/A}
  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto:N/A}
  storage:
    type: ${discodeit.storage.type:N/A}
    path: ${discodeit.storage.local.root-path:N/A}
    s3-bucket: ${AWS_S3_BUCKET:N/A}
    s3-region: ${AWS_S3_REGION:N/A}
  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size:N/A}
    max-request-size: ${spring.servlet.multipart.max-request-size:N/A}
