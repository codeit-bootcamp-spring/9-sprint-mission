server:
  port: ${APP_PORT:808}

spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:discodeit}
    username: ${DB_USER:discodeit_user}
    password: ${DB_PASSWORD:discodeit1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# AWS S3 설정 추가
cloud:
  aws:
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
    region:
      static: ${AWS_S3_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

sql:
  init:
    mode: always