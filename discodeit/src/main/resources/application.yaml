spring:
  application:
    name: discodeit
  profiles:
    active: local
  main:
    allow-bean-definition-overriding: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB

