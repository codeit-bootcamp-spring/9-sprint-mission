server:
  port: 80 # 또는 운영 환경에 맞는 포트 번호 (예: 443, 8080)

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://prod-db-host:5432/discodeit_prod
    username: prod_user
    password: prod_password
  jpa:
    hibernate:
      ddl-auto: none # 운영 환경에서는 스키마 자동 변경을 방지하기 위해 none 사용 권장

logging:
  level:
    com.sprint.mission.discodeit: info # 운영 환경에서는 debug보다 info 수준으로 설정하는 것이 일반적