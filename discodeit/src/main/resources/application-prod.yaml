server:
  port: ${PORT:5000}

spring:
  application:
    name: discodeit
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL}

discodeit:
  storage:
    local:
      root-path: /var/lib/discodeit/storage

logging:
  level:
    root: INFO
