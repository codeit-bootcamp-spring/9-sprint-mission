spring:
  application:
    name: discodeit

  # 1. 데이터베이스 연결 설정 (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  # 2. SQL 초기화 설정 (서버 켤 때 schema.sql 자동 실행)
  sql:
    init:
      mode: always

  # 3. JPA 및 Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: validate # 강사님 권장! DB 구조와 엔티티가 맞는지 검증만 해요.
    show-sql: true       # 실행되는 SQL을 콘솔창에 보여줘요.
    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 정렬해서 보여줘요.

# 4. 서버 포트 설정
server:
  port: ${PORT:8080}

# 5. [추가됨] 디스코드잇 전용 설정 (파일 저장소)
discodeit:
  storage:
    type: local         # 로컬 저장 방식을 사용하겠다는 뜻!
    local:
      root-path: ./uploads # 파일이 저장될 폴더 위치예요.