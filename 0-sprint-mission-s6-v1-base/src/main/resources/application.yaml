spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none   # 이미 schema.sql로 테이블을 만들었으니, 테이블을 자동으로 만들 필요 없음
    show-sql: true     # 콘솔에 SQL 로그 출력
    properties:
      hibernate:
        format_sql: true     # SQL 로그를 보기 좋게 포맷팅
        use_sql_comments: true   # 쿼리의 주석도 표시

logging:
  level:
    org:
      hibernate:
        SQL: debug
        type.descriptor.sql: trace