$kind: http-example
request:
  url: "{{baseUrl}}/api/users/:userId/userStatus"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    - key: userId
      value: 03222b9a-5a51-5b6c-6f5d-479256b51140
      description: 상태를 변경할 User ID
  body:
    type: json
    content: |-
      {
        "newLastActiveAt": "1995-01-24T08:38:50.333Z"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: UserStatus with userId {userId} not found
order: 2000
