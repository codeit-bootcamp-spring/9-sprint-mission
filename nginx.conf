server {
    listen 80;

    # /api/ 또는 /ws/로 시작하는 요청은 백엔드 컨테이너로 전달
    location ~ ^/(api|ws)/ {
        proxy_pass http://discodeit-app:8082; # app 컨테이너의 포트(SERVER_PORT)에 맞춰주세요
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 그 외 모든 요청은 정적 리소스(프론트엔드) 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}