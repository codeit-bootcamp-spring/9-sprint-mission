spring:
  application:
    name: discodeit

  config:
    import: optional:file:.env[.properties],optional:file:discodeit.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  servlet:
    multipart:
      max-fileSize: 10MB
      max-requestSize: 30MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

discodeit:
  storage:
    type: ${STORAGE_TYPE:${DISCODEIT_STORAGE_TYPE:local}}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:${DISCODEIT_STORAGE_S3_ACCESS_KEY:}}
      secret-key: ${AWS_S3_SECRET_KEY:${DISCODEIT_STORAGE_S3_SECRET_KEY:}}
      region: ${AWS_S3_REGION:${DISCODEIT_STORAGE_S3_REGION:}}
      bucket: ${AWS_S3_BUCKET:${DISCODEIT_STORAGE_S3_BUCKET:}}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:${DISCODEIT_STORAGE_S3_PRESIGNED_URL_EXPIRATION:600}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers