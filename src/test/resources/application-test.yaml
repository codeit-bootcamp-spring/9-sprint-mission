spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

discodeit:
  storage:
    type: local
    local:
      root-path: .test-storage

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
