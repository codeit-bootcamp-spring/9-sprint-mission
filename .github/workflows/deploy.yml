name: CD (Deploy to Public ECR & ECS)

on:
  push:
    branches:
      - "육선우sprint8"

  workflow_run:
    workflows: [ "CI (Java with Gradle)" ]
    types:
      - completed

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: discodeit-cluster
  ECS_SERVICE: discodeit-service
  ECS_TASK_DEFINITION_NAME: discodeit-task
  CONTAINER_NAME: discodeit-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop existing ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 0

      - name: Download current task definition
        run: |
          # AWS CLI 쿼리만 사용하여 JSON 구조를 깨뜨리지 않고 메모리(1024)와 CPU(512)를 강제 주입합니다.
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_NAME }} \
            --query '{
              containerDefinitions: taskDefinition.containerDefinitions,
              family: taskDefinition.family,
              taskRoleArn: taskDefinition.taskRoleArn,
              executionRoleArn: taskDefinition.executionRoleArn,
              networkMode: taskDefinition.networkMode,
              volumes: taskDefinition.volumes,
              placementConstraints: taskDefinition.placementConstraints,
              requiresCompatibilities: taskDefinition.requiresCompatibilities,
              cpu: "512",
              memory: "1024"
            }' > task-definition.json

          # 컨테이너 내부 메모리 설정도 1024로 안전하게 맞춥니다. (RESOURCE:MEMORY 방지)
          # jq가 가장 정확하므로 아래 한 줄만 정확히 실행합니다.
          jq '.containerDefinitions[0].memory = 1024 | .containerDefinitions[0].memoryReservation = 512' task-definition.json > tmp.json && mv tmp.json task-definition.json
          
          cat task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: public.ecr.aws/${{ secrets.ECR_ALIAS }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          desired-count: 1
          wait-for-service-stability: true