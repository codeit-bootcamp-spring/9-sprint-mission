name: Java CD with Gradle

on:
  push:
    branches: [ "release" ] # release 브랜치에 푸시될 때만 배포

jobs:
  deploy:
    runs-on: ubuntu-latest

    # [경로 수정] 모든 run 명령어의 기본 실행 경로를 discodeit 폴더로 설정합니다.
    defaults:
      run:
        working-directory: ./discodeit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. AWS 인증 (Secrets 활용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1 # Public ECR 배포를 위해 us-east-1 권장

      # 2. Amazon ECR 로그인
      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # 3. Docker 이미지 빌드 및 푸시
      # defaults 설정 덕분에 자동으로 discodeit 폴더 내의 Dockerfile을 찾아 빌드합니다.
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 4. AWS ECS 태스크 정의 업데이트 및 서비스 배포
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          # [경로 수정] discodeit 폴더 안에 생성될 JSON 파일의 경로를 명시합니다.
          task-definition: discodeit/task-definition.json
          container-name: discodeit-app
          image: ${{ steps.login-ecr-public.outputs.registry }}/${{ vars.ECR_REPOSITORY_URI }}:latest

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true