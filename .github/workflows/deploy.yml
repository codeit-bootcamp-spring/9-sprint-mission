name: CD (Deploy to Public ECR & ECS)

on:
  push:
    branches:
      - "육선우sprint8"

  workflow_run:
    workflows: [ "CI (Java with Gradle)" ]
    types:
      - completed

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: discodeit-cluster
  ECS_SERVICE: discodeit-service
  ECS_TASK_DEFINITION_NAME: discodeit-task
  CONTAINER_NAME: discodeit-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 선우님의 GitHub Secrets 이름과 일치시켰습니다.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop existing ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 0

      - name: Download current task definition
        run: |
          # AWS CLI 쿼리를 사용해 필요한 필드만 추출하여 task-definition.json을 생성합니다.
          # 이 방식은 jq 에러와 enableFaultInjection 같은 최신 필드 충돌을 방지합니다.
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_NAME }} \
            --query '{containerDefinitions: taskDefinition.containerDefinitions, family: taskDefinition.family, taskRoleArn: taskDefinition.taskRoleArn, executionRoleArn: taskDefinition.executionRoleArn, networkMode: taskDefinition.networkMode, volumes: taskDefinition.volumes, placementConstraints: taskDefinition.placementConstraints, requiresCompatibilities: taskDefinition.requiresCompatibilities, cpu: taskDefinition.cpu, memory: taskDefinition.memory}' > task-definition.json
          
          # 파일 생성 확인 및 로그 출력
          if [ ! -s task-definition.json ]; then
            echo "Error: task-definition.json is empty"
            exit 1
          fi
          cat task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: public.ecr.aws/${{ secrets.ECR_ALIAS }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          desired-count: 1
          wait-for-service-stability: true