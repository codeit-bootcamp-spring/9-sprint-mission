name: CD (Deploy)

on:
  push:
    branches: [ "release" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [수정] Public ECR 로그인을 위해 리전은 us-east-1으로 고정 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      # [수정] Public ECR 전용 로그인 액션 설정
      - name: Login to Amazon Public ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build, tag, and push image to Amazon ECR
        env:
          # registry 출력을 public용 id에서 가져오도록 수정
          ECR_REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          # [요구사항] latest와 커밋 해시(github.sha) 듀얼 태깅
          # 빌드 시간 단축을 위해 멀티 플랫폼 옵션 제외 (기본 x86_64 빌드)
          docker build -t $ECR_REPOSITORY:latest \
                       -t $ECR_REPOSITORY:${{ github.sha }} .
          
          # 두 태그 모두 푸시
          docker push $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:${{ github.sha }}

      - name: Update ECS Service (Force New Deployment)
        run: |
          # 서비스 업데이트는 실제 ECS가 있는 리전(vars.AWS_REGION)에서 수행
          aws ecs update-service --cluster ${{ vars.ECS_CLUSTER }} \
                                 --service ${{ vars.ECS_SERVICE }} \
                                 --region ${{ vars.AWS_REGION }} \
                                 --force-new-deployment