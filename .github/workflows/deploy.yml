name: Java CD with AWS ECR & ECS

on:
  pull_request:
    branches: [ "한성재_sprint8_release" ]
  push:
    branches: ["한성재_sprint8"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./discodeit

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build, tag, and push image to Amazon ECR
        env:
          REPO_URI: ${{ vars.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. 변수가 비어있는지 확인 (디버깅용)
          if [ -z "$REPO_URI" ]; then
            echo "Error: ECR_REPOSITORY_URI variable is empty. Check your GitHub Actions Variables settings."
            exit 1
          fi

          echo "Using Repository URI: $REPO_URI"
          # 2. 빌드 및 태그 지정
          # 전체 경로를 그대로 사용하여 태그를 생성합니다.
          docker build -t $REPO_URI:$IMAGE_TAG -t $REPO_URI:latest .
          
          # 3. 푸시
          docker push $REPO_URI:$IMAGE_TAG
          docker push $REPO_URI:latest
          
          # 4. 다음 단계를 위해 출력값 저장
          echo "image=$REPO_URI:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Reconfigure AWS credentials for ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
          --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./discodeit/task-definition.json
          container-name: discodeit-container
          image: ${{ vars.ECR_REPOSITORY_URI }}:latest

      - name: Stop existing service for Free Tier
        run: |
          aws ecs update-service --cluster ${{ vars.ECS_CLUSTER }} \
          --service ${{ vars.ECS_SERVICE }} --desired-count 0

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true