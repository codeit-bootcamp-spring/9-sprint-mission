name: Java CI with Gradle and CodeCov

on:
  push:
    branches: [ "hyunhong-sprint8" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: ./discodeit
        run: chmod +x gradlew



      # 테스트 실행 및 커버리지 보고서 생성 (JaCoCo 활용)
      - name: Test with Gradle
        working-directory: ./discodeit
        env:
          AWS_S3_ACCESS_KEY: "dummy-access-key"
          AWS_S3_SECRET_KEY: "dummy-secret-key"
          AWS_S3_REGION: "ap-northeast-2"
          AWS_S3_BUCKET: "dummy-bucket"
        run: ./gradlew test

      # CodeCov에 결과 업로드
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          working-directory: ./discodeit
          token: ${{ secrets.CODECOV_TOKEN }} # CodeCov에서 발급받은 토큰