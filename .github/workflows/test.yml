name: CI Pipeline (Test)

on:
  pull_request:
    branches:
      - main  # PR이 오면 실행

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3-1. 테스트용 환경 파일 생성 (에러 방지)
        working-directory: ./discodeit
        run: |
          touch discodeit.env
          touch .env

      - name: 3. 테스트 실행 (H2 설정 적용)
        working-directory: ./discodeit
        run: ./gradlew test -Dspring.profiles.active=test

      - name: 4. 테스트 결과 보고서 업로드 (Codecov)
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./discodeit/build/reports/jacoco/test