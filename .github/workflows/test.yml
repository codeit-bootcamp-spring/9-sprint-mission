name: Java CI with Gradle

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    # [핵심] 환경 변수를 최상단(Job 레벨)으로 이동해서 로봇이 확실히 인지하게 합니다.
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      STORAGE_TYPE: s3
      AWS_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_S3_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_S3_PRESIGNED_URL_EXPIRATION: 600
      # [필살기] DB 테이블이 없어도 자동으로 만들어서 테스트하도록 설정
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    defaults:
      run:
        working-directory: ./discodeit

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Test
        run: |
          chmod +x gradlew
          ./gradlew test