name: Java CI with Gradle

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    # [핵심] 모든 실행 단계의 기본 위치를 discodeit 폴더로 고정합니다.
    defaults:
      run:
        working-directory: ./discodeit

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Test
        # 이제 로봇이 알아서 discodeit 폴더 안에서 이 명령어를 실행합니다.
        run: |
          chmod +x gradlew
          ./gradlew test