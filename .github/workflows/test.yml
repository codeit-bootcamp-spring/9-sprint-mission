name: Java CI with Gradle

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      # 깃허브 시크릿(S3 없음)을 코드 환경 변수(S3 있음)로 연결합니다!
      AWS_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_S3_REGION: ${{ secrets.AWS_REGION }}
      # 버킷 이름은 요구사항에 없었으므로, 깃허브 시크릿에 'AWS_S3_BUCKET'이 등록되어 있어야 합니다.
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_S3_PRESIGNED_URL_EXPIRATION: 600

    defaults:
      run:
        working-directory: ./discodeit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test with Gradle
        # 이제 환경 변수가 정확히 주입되어 S3 관련 테스트도 통과할 것입니다.
        run: ./gradlew test