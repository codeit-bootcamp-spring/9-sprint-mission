$kind: http-example
request:
  url: "{{baseUrl}}/api/readStatuses/:readStatusId"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    - key: readStatusId
      value: ba7a00cc-935d-8c36-3a21-f054fe4fdd64
      description: 수정할 읽음 상태 ID
  body:
    type: json
    content: |-
      {
        "newLastReadAt": "1955-05-02T17:24:11.981Z"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: ReadStatus with id {readStatusId} not found
order: 2000
