$kind: http-example
request:
  url: "{{baseUrl}}/api/users/:userId/userStatus"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    - key: userId
      value: 057d00a7-3aa4-4f8e-af42-9384102da703
      description: 상태를 변경할 User ID
  body:
    type: json
    content: |-
      {
        "newLastActiveAt": "1981-05-25T03:32:11.097Z"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain;charset=UTF-8
    Content-Length: "67"
    Date: Thu, 05 Mar 2026 05:15:21 GMT
    Keep-Alive: timeout=60
    Connection: keep-alive
  body:
    type: text
    content: UserStatus with user 057d00a7-3aa4-4f8e-af42-9384102da704 not found
order: 2000
