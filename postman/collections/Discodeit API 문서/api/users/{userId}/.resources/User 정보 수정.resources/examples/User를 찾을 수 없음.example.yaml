$kind: http-example
request:
  url: "{{baseUrl}}/api/users/:userId"
  method: PATCH
  headers:
    Content-Type: multipart/form-data
    Accept: "*/*"
  pathVariables:
    - key: userId
      value: e9c7df38-50cf-cc1b-7f47-c0a3289566dc
      description: 수정할 User ID
  body:
    type: formdata
    content:
      - type: text
        key: userUpdateRequest
        value: "[object Object]"
        description: 수정할 User 정보
      - type: file
        key: profile
        src: []
        description: 수정할 User 프로필 이미지
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: User with id {userId} not found
order: 3000
