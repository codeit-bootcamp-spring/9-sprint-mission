$kind: http-example
request:
  url: "{{baseUrl}}/api/users/:userId"
  method: PATCH
  headers:
    Content-Type: multipart/form-data
    Accept: "*/*"
  pathVariables:
    - key: userId
      value: 4a2370b7-c5d4-4afb-b66a-701a1e97c33a
      description: 수정할 User ID
  body:
    type: formdata
    content:
      - type: text
        key: userUpdateRequest
        value: '{"newUsername":"투썸플레이스","newEmail":"twsomeplace@samsung.com","newPassword":"twosomeplace"}'
        contentType: application/json
        description: 수정할 User 정보
      - type: file
        key: profile
        src: []
        description: 수정할 User 프로필 이미지
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain;charset=UTF-8
    Content-Length: "59"
    Date: Thu, 05 Mar 2026 05:12:15 GMT
    Keep-Alive: timeout=60
    Connection: keep-alive
  body:
    type: text
    content: User with id 4a2370b7-c5d4-4afb-b66a-701a1e97c33a not found
order: 3000
