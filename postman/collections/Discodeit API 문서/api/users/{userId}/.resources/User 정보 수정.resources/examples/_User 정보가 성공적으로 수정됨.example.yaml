$kind: http-example
request:
  url: "{{baseUrl}}/api/users/:userId"
  method: PATCH
  headers:
    Content-Type: multipart/form-data
    Accept: "*/*"
  pathVariables:
    - key: userId
      value: 4a2370b7-c5d4-4afb-b66a-701a1e97c339
      description: 수정할 User ID
  body:
    type: formdata
    content:
      - type: text
        key: userUpdateRequest
        value: '{"newUsername":"투썸","newEmail":"twsome@samsung.com","newPassword":"twosomeplace"}'
        contentType: application/json
        description: 수정할 User 정보
      - type: file
        key: profile
        src:
          - /C:/Users/mathe/Downloads/sprint-image/profile-6.jpg
        description: 수정할 User 프로필 이미지
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Transfer-Encoding: chunked
    Date: Thu, 05 Mar 2026 05:13:09 GMT
    Keep-Alive: timeout=60
    Connection: keep-alive
  body:
    type: text
    content: |-
      {
          "id": "4a2370b7-c5d4-4afb-b66a-701a1e97c339",
          "username": "투썸",
          "email": "twsome@samsung.com",
          "profileId": {
              "id": "b7978668-961d-4835-afec-ed17990f9612",
              "fileName": "profile-6.jpg",
              "size": 9189,
              "contentType": "image/jpeg"
          },
          "online": false
      }
order: 1000
