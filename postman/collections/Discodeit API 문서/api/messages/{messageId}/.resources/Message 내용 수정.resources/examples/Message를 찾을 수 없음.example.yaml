$kind: http-example
request:
  url: "{{baseUrl}}/api/messages/:messageId"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    - key: messageId
      value: e9c7df38-50cf-cc1b-7f47-c0a3289566dc
      description: 수정할 Message ID
  body:
    type: json
    content: |-
      {
        "newContent": "string"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: Message with id {messageId} not found
order: 2000
