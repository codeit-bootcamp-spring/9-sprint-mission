$kind: http-example
request:
  url: "{{baseUrl}}/api/messages/:messageId"
  method: DELETE
  headers:
    Accept: "*/*"
  pathVariables:
    - key: messageId
      value: e9c7df38-50cf-cc1b-7f47-c0a3289566dc
      description: 삭제할 Message ID
