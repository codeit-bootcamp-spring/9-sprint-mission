$kind: http-example
request:
  url: "{{baseUrl}}/api/messages"
  method: POST
  headers:
    Content-Type: multipart/form-data
    Accept: "*/*"
  body:
    type: formdata
    content:
      - type: text
        key: messageCreateRequest
        value: "[object Object]"
        description: Message 생성 정보
      - type: text
        key: attachments
        value: string,string
        description: Message 첨부 파일들
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: Channel | Author with id {channelId | author} not found
order: 2000
