$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "username": "아메리카노s",
        "password": "americanos"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain;charset=UTF-8
    Content-Length: "45"
    Date: Thu, 05 Mar 2026 06:17:03 GMT
    Keep-Alive: timeout=60
    Connection: keep-alive
  body:
    type: text
    content: User with username 아메리카노s not found
order: 3000
