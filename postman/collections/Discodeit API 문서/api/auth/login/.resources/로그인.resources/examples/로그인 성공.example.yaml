$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "username": "string",
        "password": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "id": "d8134e30-d9f0-afe8-a8e8-c239e0b63035",
        "username": "string",
        "email": "string",
        "profile": {
          "id": "b5bc5134-edd5-ebc3-0cac-c2d5a352b3da",
          "fileName": "string",
          "size": 477,
          "contentType": "string"
        },
        "online": true
      }
order: 1000
