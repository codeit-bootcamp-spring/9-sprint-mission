$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "username": "string",
        "password": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: Wrong password
order: 2000
