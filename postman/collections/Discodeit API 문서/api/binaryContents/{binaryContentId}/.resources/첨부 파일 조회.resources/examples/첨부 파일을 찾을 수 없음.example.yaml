$kind: http-example
request:
  url: "{{baseUrl}}/api/binaryContents/:binaryContentId"
  method: GET
  headers:
    Accept: "*/*"
  pathVariables:
    - key: binaryContentId
      value: e9c7df38-50cf-cc1b-7f47-c0a3289566dc
      description: 조회할 첨부 파일 ID
