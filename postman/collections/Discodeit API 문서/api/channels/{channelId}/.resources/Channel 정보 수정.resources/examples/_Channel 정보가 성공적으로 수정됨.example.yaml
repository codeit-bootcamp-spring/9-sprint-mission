$kind: http-example
request:
  url: "{{baseUrl}}/api/channels/:channelId"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    - key: channelId
      value: 162895e4-4b9c-43d3-8b3a-cc7dc9f3aa88
      description: 수정할 Channel ID
  body:
    type: json
    content: |-
      {
        "newName": "수정된-채널",
        "newDescription": "채널명이 수정되었다고 하더라."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Transfer-Encoding: chunked
    Date: Thu, 05 Mar 2026 06:14:03 GMT
    Keep-Alive: timeout=60
    Connection: keep-alive
  body:
    type: text
    content: |-
      {
          "id": "162895e4-4b9c-43d3-8b3a-cc7dc9f3aa88",
          "type": "PUBLIC",
          "name": "수정된-채널",
          "description": "채널명이 수정되었다고 하더라.",
          "participants": [],
          "lastMessageAt": null
      }
order: 1000
