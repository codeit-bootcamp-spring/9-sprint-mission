$kind: http-example
request:
  url: "{{baseUrl}}/api/channels/:channelId"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    - key: channelId
      value: fe134767-f12d-4713-a99e-d604f17fce61
      description: 수정할 Channel ID
  body:
    type: json
    content: |-
      {
        "newName": "수정된-채널",
        "newDescription": "채널명이 수정되었다고 하더라."
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: text/plain;charset=UTF-8
    Content-Length: "33"
    Date: Thu, 05 Mar 2026 06:14:31 GMT
    Connection: close
  body:
    type: text
    content: Private channel cannot be updated
order: 2000
