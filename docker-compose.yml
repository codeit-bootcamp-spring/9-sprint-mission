version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    env_file:
      - discodeit.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/discodeit}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-discodeit}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-discodeit}
    depends_on:
      - db
    volumes:
      - app-data:/app/data

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discodeit}
      POSTGRES_USER: ${POSTGRES_USER:-discodeit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discodeit}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  app-data:
  db-data: