version: '3.8'

services:
  # 1. Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: discodeit-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mission4/src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - discodeit-network

  # 2. Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-dev}
      SERVER_PORT: ${APP_INTERNAL_PORT:-8082}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${SPRING_DATASOURCE_NAME:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      DISCODEIT_STORAGE_TYPE: ${STORAGE_TYPE:-local}
      DISCODEIT_STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH:-.discodeit/storage}
      DISCODEIT_STORAGE_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      DISCODEIT_STORAGE_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      DISCODEIT_STORAGE_S3_REGION: ${AWS_S3_REGION}
      DISCODEIT_STORAGE_S3_BUCKET: ${AWS_S3_BUCKET}
      DISCODEIT_STORAGE_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION:-600}
      # [수정] Kafka 브로커 주소 명시
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      # [추가] Redis 연결을 위한 환경 변수 주입
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISCODEIT_KAFKA_GROUP_ID: "ws-group-${HOSTNAME}"
    volumes:
      - ./${STORAGE_LOCAL_ROOT_PATH:-.discodeit/storage}:/app/${STORAGE_LOCAL_ROOT_PATH:-.discodeit/storage}
    depends_on:
      - db
      - redis
      - broker
    restart: on-failure
    expose:
      - "8082"
    networks:
      - discodeit-network

  # 3. DB
  db:
    image: postgres:15-alpine
    container_name: discodeit-db
    ports:
      - "54332:5432"
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_NAME:-discodeit}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mission4/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    restart: always
    networks:
      - discodeit-network

  # 4. Redis
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - discodeit-network

  # 5. Kafka
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - "29092:29092"
      - "9092:9092" # 외부 통신용 포트 추가 오픈
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      # [핵심] 리스너마다 포트를 다르게 설정
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      # [핵심] 광고할 주소를 각각 다르게 설정
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - discodeit-network

volumes:
  postgres_data:
  redis-data:

networks:
  discodeit-network:



