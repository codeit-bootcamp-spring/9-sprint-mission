version: '3.8'

services:

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - proxy-network

  backend:
    build: .
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/discodeit
      SPRING_DATASOURCE_USERNAME: discodeit
      SPRING_DATASOURCE_PASSWORD: discodeit
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      # 아래는 필요에 따라 실제 값으로 채워주세요
      STORAGE_TYPE: local
      DISCODEIT_ADMIN_USERNAME: admin
      DISCODEIT_ADMIN_EMAIL: admin@discodeit.com
      DISCODEIT_ADMIN_PASSWORD: admin1234
      JWT_ACCESS_SECRET: your-access-token-secret-key-here-make-it-long-and-random
      JWT_REFRESH_SECRET: your-refresh-token-secret-key-here-make-it-different-and-long
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - proxy-network
      - internal-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: discodeit
      POSTGRES_PASSWORD: discodeit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discodeit"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-network

  broker:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "discodeit-kafka-cluster"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - internal-network

networks:
  proxy-network:
  internal-network:

volumes:
  postgres-data:
  redis-data:
  kafka-data: