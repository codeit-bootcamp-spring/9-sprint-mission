version: '3.8'

services:
  # 1. Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: discodeit-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - discodeit-network

  # 2. Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discodeit-app
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${SPRING_DATASOURCE_NAME:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      - db
      - redis
      - broker
    networks:
      - discodeit-network

  # 3. DB
  db:
    image: postgres:15-alpine
    container_name: discodeit-db
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_NAME:-discodeit}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mission4/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    networks:
      - discodeit-network

  # 4. Redis
  redis:
    image: redis:7.2-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - discodeit-network

  # 5. Kafka
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - discodeit-network

# 통합 볼륨 설정
volumes:
  postgres_data:
  redis-data:

# 통합 네트워크 설정
networks:
  discodeit-network:
    external: true