version: '3.8'

services:
  # 1. Reverse Proxy (외부 통로)
  nginx:
    image: nginx:latest
    container_name: discodeit-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - discodeit-network

  # 2. Backend (사용자 원본 설정 100% 복구)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-dev}
      SERVER_PORT: ${APP_INTERNAL_PORT:-8082}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${SPRING_DATASOURCE_NAME:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      DISCODEIT_STORAGE_TYPE: ${STORAGE_TYPE:-local}
      DISCODEIT_STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH:-.discodeit/storage}
      DISCODEIT_STORAGE_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      DISCODEIT_STORAGE_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      DISCODEIT_STORAGE_S3_REGION: ${AWS_S3_REGION}
      DISCODEIT_STORAGE_S3_BUCKET: ${AWS_S3_BUCKET}
      DISCODEIT_STORAGE_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION:-600}
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
    volumes:
      - ./${STORAGE_LOCAL_ROOT_PATH:-.discodeit/storage}:/app/${STORAGE_LOCAL_ROOT_PATH:-.discodeit/storage}
    depends_on:
      - db
      - redis
      - broker
    restart: on-failure
    networks:
      - discodeit-network

  # 3. DB (사용자 원본 설정 100% 복구 + 포트 제거)
  db:
    image: postgres:15-alpine
    container_name: discodeit-db
    ports:
      - "54332:5432"
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_NAME:-discodeit}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mission4/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    restart: always
    networks:
      - discodeit-network

  # 4. Redis
  redis:
    image: redis:7.2-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - discodeit-network

  # 5. Kafka
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - discodeit-network

volumes:
  postgres_data:
  redis-data:

networks:
  discodeit-network:
    external: true