upstream backend {
    # round robin
    server backend:80;

    # weight
    # server discodeit-backend-1:80 weight=3;
    # server discodeit-backend-2:80 weight=2;
    # server discodeit-backend-3:80 weight=1;

    # least connection
    # least_conn;
    # server discodeit-backend-1:80;
    # server discodeit-backend-2:80;
    # server discodeit-backend-3:80;

    # ip hash
    ip_hash;
    # server discodeit-backend-1:80;
    # server discodeit-backend-2:80;
    # server discodeit-backend-3:80;
}

server {
    listen 80;
    server_name _;

    underscores_in_headers on;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # 쿠키 헤더 누락 방지
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_pass_request_headers on;

        proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;

        # SSE 필수 설정들
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # 어떤 backend 인스턴스가 처리했는지 응답 헤더로 확인
        add_header X-Upstream-Server $upstream_addr always;
    }

    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # WebSocket 업그레이드 응답(101)은 always 없이는 헤더가 안 붙음
        add_header X-Upstream-Server $upstream_addr always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}