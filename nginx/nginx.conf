# upstream backend { ... } 블록은 docker-entrypoint.sh가 기동 시점에
# /etc/nginx/conf.d/upstream.conf 로 생성한다 (deploy.replicas로 뜬 backend
# 컨테이너들의 IP를 DNS로 조회해 server 라인을 풀어쓰기 위함).
# 로드밸런싱 전략을 바꾸려면 upstream.conf 생성 로직(docker-entrypoint.sh)의
# least_conn / ip_hash / weight 주석을 조정한다.

server {
    listen 80;
    server_name _;

    location ^~ /api/sse {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Upstream-Server $upstream_addr;
    }

    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Upstream-Server $upstream_addr;
    }

    location ^~ /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        add_header X-Upstream-Server $upstream_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
