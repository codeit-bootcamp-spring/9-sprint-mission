<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 목록</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>사용자 목록</h1>
    <div class="user-list" id="userList">
        </div>
</div>

<div id="updateModal" class="modal-overlay">
    <div class="modal-window">
        <h3>사용자 정보 수정</h3>
        <input type="hidden" id="updateUserId">
        
        <div class="input-field">
            <label>새 이름</label>
            <input type="text" id="updateNewName" placeholder="변경할 이름을 입력하세요">
        </div>
        
        <div class="input-field">
            <label>새 이메일</label>
            <input type="email" id="updateNewEmail" placeholder="변경할 이메일을 입력하세요">
        </div>

        <div class="input-field">
            <label>새 비밀번호</label>
            <input type="password" id="updateNewPassword" placeholder="비밀번호를 입력해야 저장됩니다">
        </div>

        <div class="modal-btns">
            <button onclick="submitUpdate()" class="save-btn">저장하기</button>
            <button onclick="closeModal()" class="cancel-btn">취소</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
