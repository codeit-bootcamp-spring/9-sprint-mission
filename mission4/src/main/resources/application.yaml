spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit # 💡 로컬 개발 시 기본 타격
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none # Querydsl 및 엔티티 대조를 위한 안전 규격
    open-in-view: false
  profiles:
    active: dev # 💡 인프라 배포 시 주 타겟을 prod 파일로 기본 셋업
  cache:
    caffeine:
      spec: >
        maximumSize=100,
        expireAfterAccess=600s,
        recordStats
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,caches
  endpoint:
    health:
      show-details: always
  observations:
    annotations:
      enabled: true

info:
  name: Discodeit
  version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0

discodeit:
  storage:
    type: local # 기본 로컬 저장소 지향
    local:
      root-path: ./storage

logging:
  level:
    root: info

jwt:
  secret: bXktand0LXNlY3JldC1rZXktZm9yLXNwcmluZy1zZWN1cml0eQ==
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 604800


