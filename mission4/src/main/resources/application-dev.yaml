server:
  port: 8082


spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      open-in-view: false

    show-sql: false
    defer-datasource-initialization: true

    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.sprint.mission.discodeit: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.sql.ast.create: INFO
    org.hibernate.orm.sql.ast.tree: INFO
    org.hibernate.query.sqm.sql: INFO
    org.hibernate.orm.results: INFO
    org.hibernate.type.descriptor.sql: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan([%thread]) %yellow(%logger{15}) - %msg%n"


discodeit:
  storage:
    type: local  # 이 부분이 없거나 틀리면 @ConditionalOnProperty가 이 빈을 죽입니다.
    local:
      root-path: ./storage # @Value 주입을 위해서도 필요함