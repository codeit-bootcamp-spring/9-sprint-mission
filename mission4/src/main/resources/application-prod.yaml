server:
  port: ${SERVER_PORT:80}
  tomcat:
    threads:
      max: 20        # 스레드당 1MB 스택 메모리 절약 최적화 사양
      min-spare: 2

spring:
  main:
    lazy-initialization: false # 기동 시 메모리 피크 감소 레이어 가동

  datasource:
    url: ${SPRING_DATASOURCE_URL} # 💡 AWS RDS 실제 엔드포인트를 동적 주입받음
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # ⚠️ 운영 데이터베이스 스키마 파괴 방지를 위한 필수 락(Lock)
      open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        query.plan_cache_max_size: 64
        query.plan_parameter_metadata_max_size: 16
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jmx:
    enabled: false # JMX 비활성화를 통한 컨테이너 메모리 세이브

logging:
  level:
    com.example: info
    org.springframework: info
    org.hibernate.SQL: info
  pattern:
    console: "%d{yy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

discodeit:
  storage:
    type: s3 # 💡 운영 환경이므로 안전한 AWS S3 원격 저장소 완벽 조준
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}