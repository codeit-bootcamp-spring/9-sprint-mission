spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: never

logging:
  level:
    root: info
    org.hibernate.SQL: DEBUG
    com.sprint.mission.discodeit: DEBUG

discodeit:
  storage:
    type: local
    local:
      root-path: ./test-outputs
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:dummy}
      secret-key: ${AWS_S3_SECRET_KEY:dummy}
      region: ${AWS_S3_REGION:ap-northeast-2}
      bucket: ${AWS_S3_BUCKET:dummy-bucket}